services:
  api:
    image: pet-radar-api:latest
    container_name: PetRadarApi
    environment:
      - MAILER_SERVICE=${MAILER_SERVICE}
      - MAILER_USER=${MAILER_USER}
      - MAILER_TOKEN=${MAILER_TOKEN}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - DB_NAME=${DB_NAME}
      - DB_HOST=${DB_HOST}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USER=${DB_USER}
      - DB_PORT=${DB_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}

    ports:
      - 3000:3000
    depends_on:
      - postgres

  postgres:
    image: postgis/postgis:16-master
    container_name: 511-petradar-db
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=secret123
      - POSTGRES_DB=petradardb
    volumes:
      - postgres_data_db:/var/lib/postgresql

  redis:
    image: redis
    container_name: 511-petradar-redis
    ports:
      - 6379:6379
    volumes:
      - redis_data_db:/data

volumes:
  postgres_data_db:
  redis_data_db:
  